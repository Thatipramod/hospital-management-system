<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Analytics - Pramod Hospital</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .header { background: #8e44ad; color: white; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px;}
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center;}
        .stat-card h2 { margin: 0; color: #7f8c8d; font-size: 18px; }
        .stat-card p { font-size: 32px; font-weight: bold; color: #2c3e50; margin: 10px 0 0 0; }
        .chart-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: auto;}
    </style>
</head>
<body>

    <div class="header">
        <h1>Hospital Administration Overview</h1>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h2>Total Registered Patients</h2>
            <p id="totalPatients">Loading...</p>
        </div>
        <div class="stat-card">
            <h2>Total Revenue Collected</h2>
            <p id="totalRevenue" style="color: #27ae60;">Loading...</p>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="appointmentChart"></canvas>
    </div>

    <script>
        window.onload = async () => {
            // Fetch stats from your Flask backend
            const response = await fetch('/api/admin/stats');
            const data = await response.json();

            // Update text widgets
            document.getElementById('totalPatients').innerText = data.total_patients;
            document.getElementById('totalRevenue').innerText = '₹' + data.total_revenue;

            // Render Chart.js
            const ctx = document.getElementById('appointmentChart').getContext('2d');
            
            // Format data for the chart
            const labels = Object.keys(data.chart_data); // e.g., ['Scheduled', 'Completed']
            const chartValues = Object.values(data.chart_data); // e.g., [10, 5]

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Appointments by Status',
                        data: chartValues,
                        backgroundColor: [
                            '#3498db', // Blue for Scheduled
                            '#2ecc71', // Green for Completed
                            '#e74c3c'  // Red for Cancelled
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' },
                        title: { display: true, text: 'Appointment Status Distribution' }
                    }
                }
            });
        };
    </script>
</body>
</html>
